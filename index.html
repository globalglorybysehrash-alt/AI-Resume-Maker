    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Book Kaaro AI Resume &amp; Cover Letter Builder" />
    <meta property="og:description" content="Accessible, privacy-first AI resume, cover letter, and interview prep builder with editable preview, browser printing, and Book Kaaro career templates." />

    <!-- Twitter Cards -->

    <!-- Fonts: Plus Jakarta Sans for UI/prose & JetBrains Mono for tabular/code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />

    <!-- Schema.org WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Book Kaaro AI Resume & Cover Letter Builder",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Accessible, privacy-first AI resume, cover letter, and interview prep builder with editable preview, browser printing, and Book Kaaro career templates.",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Step-by-step career history intake",
        "Fact-preserving AI resume drafting",
        "Tailored matching cover letter generation",
        "Targeted interview questions with STAR answers",
        "Real-time in-place editing and customization",
        "Browser print and Save as PDF layout",
        "Book Kaaro career template recommendations"
      ]
    }
    </script>
    <script>
      // Ensure canonical tag dynamically uses current origin & path
      try {
        const canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = window.location.origin + window.location.pathname;
        document.head.appendChild(canonical);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-slate-900 selection:text-white">

  </body>
